<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎访问AGIWorld-AI技术社区</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
            padding: 60px 50px;
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #1d1d1f;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        
        .site-info {
            margin: 30px 0;
            line-height: 1.8;
        }
        
        .site-name {
            color: #007aff;
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 15px;
        }
        
        h3 {
            color: #1d1d1f;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.8;
            margin: 15px 0;
        }
        
        .description {
            color: #86868b;
            font-size: 15px;
            line-height: 1.8;
            margin: 20px 0;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .short-description {
            color: #1d1d1f;
            font-size: 14px;
            font-weight: 500;
            margin: 20px 0;
        }
        
        .notice-box {
            background: #f5f5f7;
            border-radius: 16px;
            padding: 30px;
            margin-top: 40px;
            text-align: left;
        }
        
        .notice-title {
            color: #1d1d1f;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .notice-content p {
            color: #515154;
            font-size: 14px;
            line-height: 1.9;
            margin-bottom: 12px;
        }
        
        .highlight {
            color: #007aff;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>欢迎访问 AGIWorld-AI 技术社区</h1>
        
        <div class="site-info">
            
            <p class="description">
                AGIWorld-AI技术社区，专注于通用人工智能（AGI）与生成式AI的技术社区。提供LangChain开发实战、AIGC工作流教程、AI模型库及国内高速下载方案、主流开发平台对比等深度内容。助力开发者从入门到实践，探索AGI前沿技术。
            </p>
            
        </div>
        
        <div class="notice-box">
            <div class="notice-content">
                <p>
                    <h3>当前站点仅支持对中国大陆地区提供访问服务。</h3>
                </p>
                <p>
                    <h3>The current site only supports access to Chinese Mainland.</h3>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
